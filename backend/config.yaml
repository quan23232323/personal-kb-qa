# ===== Embedding 配置 =====
embedding:
  mode: local        # local | openai
  local:
    model_name: shibing624/text2vec-base-chinese
    device: cpu
    normalize_embeddings: true   # 输出归一化向量，配合 cosine 度量
  openai:
    api_key: ${OPENAI_API_KEY}   # 支持从环境变量读取，避免明文入库
    base_url: https://api.openai.com/v1
    model: text-embedding-ada-002

# ===== LLM 配置 =====
llm:
  mode: openai       # openai | ollama
  openai:
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.deepseek.com/v1
    model: deepseek-v4-pro
    temperature: 0.7
    max_tokens: 2000
  # 决策调用的温度：路由判断（检索/澄清/闲聊）要稳定，用低温；回答仍用上面的 temperature
  decision_temperature: 0.2
  ollama:
    base_url: http://localhost:11434   # 代码中会自动补 /v1（OpenAI 兼容端点）
    model: qwen2.5:7b
    temperature: 0.7

# ===== 检索配置 =====
retrieval:
  top_k: 5
  similarity_threshold: 0.4   # 余弦相似度阈值（text2vec 分数偏低，0.4 召回更稳）
  hybrid: true                # 混合检索：BM25 关键词 + 向量语义，RRF 融合；false 则仅向量
  bm25_min_score: 1.0         # 关键词路绝对分数下限：仅关键词命中需达到此值，过滤弱匹配噪声
  metric: cosine
  # 决策偏好：false = 常识类问题允许模型直接回答（不给引用）；
  #           true  = 只要问题可能命中库内内容就强制检索。
  # 当知识库本身是某个领域的完整资料集（教科书 / 产品手册）时建议开 true。
  prefer_search: false

# ===== 文档处理配置 =====
document:
  chunk_size: 500
  chunk_overlap: 50
  supported_types: [pdf, txt, md, docx, xlsx, xls, csv, pptx]   # 旧版二进制 doc/ppt 不支持，需另存为新格式
  max_file_size_mb: 50

# ===== 服务配置 =====
server:
  host: 127.0.0.1            # 默认仅本机访问；需局域网共享时改 0.0.0.0 并启用鉴权
  port: ${BACKEND_PORT:-8000}   # 可用环境变量 BACKEND_PORT 覆盖，无需改文件
  cors_origins: ["http://localhost:5173"]   # Vite 开发服务器跨域白名单
  serve_frontend: true       # 托管 frontend/dist（一键启动模式）；仅用 npm run dev 开发时可改 false

# ===== 安全配置 =====
security:
  api_key: ""                # 留空则不启用；启用后前端需带 X-API-Key 请求头

# ===== 演示模式护栏（公网 Demo 用，本地默认关闭）=====
# 打开后会：限制单 IP 与全站每日提问次数、限制单次提问字数，
# 并拒绝问答以外的所有写操作（上传/删除/新建）。详见 config.demo.yaml 与 README「公网部署」。
demo:
  enabled: false
  per_ip_daily: 3
  global_daily: 100
  max_question_chars: 200
  quota_db: ./data/demo_quota.db

# ===== 存储配置 =====
storage:
  chroma_persist_dir: ./data/chroma
  upload_dir: ./data/uploads
  sqlite_path: ./data/kb.db
